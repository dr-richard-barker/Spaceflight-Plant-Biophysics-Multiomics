name: CI — CFD Gates, FvCB Parity, Site Data & LaTeX Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies & run 4 LBM benchmark gates
        run: |
          npm ci
          npm run gates
          npm run build

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run FvCB self-checks, JS/Python parity, site data & manifest verification
        run: |
          python3 scripts/fvcb.py
          python3 scripts/check_js_parity.py
          python3 scripts/check_site_data.py
          python3 scripts/make_manifest.py
